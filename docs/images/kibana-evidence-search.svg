<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Kibana concept for incident evidence search</title>
  <desc id="desc">A conceptual log investigation with synthetic filters, a time window, and a highlighted dependency wait event in a fictional booking confirmation journey.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f7f3"/><stop offset="1" stop-color="#eeece5"/></linearGradient>
    <style>
      .h{font:700 29px 'Segoe UI',Arial,sans-serif;fill:#19242e}.s{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#637078}.label{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#26343d}.copy{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#52616a}.tiny{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#a76b1d}.mono{font:400 12px Consolas,'Courier New',monospace;fill:#37444b}.card{fill:#fff;stroke:#d7d9d2;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="680" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="90" rx="22" fill="#202a32"/><rect x="0" y="68" width="1200" height="22" fill="#202a32"/>
  <rect x="49" y="25" width="42" height="42" rx="11" fill="#f2c14e"/><path d="M62 35 L75 46 L62 57Z" fill="#25313a"/><circle cx="59" cy="35" r="5" fill="#25313a"/><circle cx="59" cy="57" r="5" fill="#25313a"/>
  <text x="108" y="54" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#fff">Kibana</text><text x="223" y="53" class="s" fill="#d2d8dc">Search evidence behind one failing request</text>
  <rect x="960" y="30" width="194" height="30" rx="15" fill="#39434a" stroke="#d8ad46"/><text x="983" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#f7d781">CONCEPTUAL • SYNTHETIC</text>

  <text x="52" y="130" class="tiny">FILTER THE QUESTION BEFORE SEARCHING THE VOLUME</text>
  <rect x="48" y="151" width="1104" height="58" rx="12" class="card"/>
  <rect x="68" y="166" width="200" height="28" rx="7" fill="#f2f5f3" stroke="#dce1dc"/><text x="82" y="185" class="copy">service: booking-confirm</text>
  <rect x="282" y="166" width="195" height="28" rx="7" fill="#f2f5f3" stroke="#dce1dc"/><text x="296" y="185" class="copy">operation: confirm</text>
  <rect x="491" y="166" width="224" height="28" rx="7" fill="#f2f5f3" stroke="#dce1dc"/><text x="505" y="185" class="copy">time: alert ± 15 minutes</text>
  <rect x="729" y="166" width="185" height="28" rx="7" fill="#f2f5f3" stroke="#dce1dc"/><text x="743" y="185" class="copy">result: failed requests</text>
  <rect x="931" y="166" width="197" height="28" rx="7" fill="#263943"/><text x="1002" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Search</text>

  <rect x="48" y="231" width="1104" height="325" rx="14" class="card"/>
  <rect x="48" y="231" width="1104" height="46" rx="14" fill="#e9eeeb"/><rect x="48" y="263" width="1104" height="14" fill="#e9eeeb"/>
  <text x="76" y="260" class="label">Time</text><text x="219" y="260" class="label">Service</text><text x="406" y="260" class="label">Event</text><text x="839" y="260" class="label">Result</text>
  <line x1="70" y1="327" x2="1130" y2="327" stroke="#e8ebe7"/><line x1="70" y1="377" x2="1130" y2="377" stroke="#e8ebe7"/><line x1="70" y1="427" x2="1130" y2="427" stroke="#e8ebe7"/><line x1="70" y1="477" x2="1130" y2="477" stroke="#e8ebe7"/>
  <text x="76" y="309" class="mono">T-03:12</text><text x="219" y="309" class="mono">web-frontend</text><text x="406" y="309" class="mono">request accepted</text><rect x="839" y="291" width="92" height="25" rx="12" fill="#e5f3eb"/><text x="857" y="308" class="copy">complete</text>
  <text x="76" y="359" class="mono">T-02:44</text><text x="219" y="359" class="mono">booking-api</text><text x="406" y="359" class="mono">confirmation started</text><rect x="839" y="341" width="92" height="25" rx="12" fill="#e5f3eb"/><text x="857" y="358" class="copy">pending</text>
  <rect x="68" y="383" width="1064" height="41" rx="7" fill="#fff1d8"/><text x="76" y="409" class="mono">T-02:31</text><text x="219" y="409" class="mono">inventory-adapter</text><text x="406" y="409" class="mono">wait on availability dependency</text><rect x="839" y="391" width="120" height="25" rx="12" fill="#f9ddb0"/><text x="855" y="408" class="copy">investigate</text>
  <text x="76" y="459" class="mono">T-02:10</text><text x="219" y="459" class="mono">booking-api</text><text x="406" y="459" class="mono">confirmation deadline exceeded</text><rect x="839" y="441" width="92" height="25" rx="12" fill="#f7e4e5"/><text x="857" y="458" class="copy">timeout</text>
  <text x="76" y="509" class="mono">T-01:58</text><text x="219" y="509" class="mono">web-frontend</text><text x="406" y="509" class="mono">customer saw retry message</text><rect x="839" y="491" width="92" height="25" rx="12" fill="#eef1f1"/><text x="857" y="508" class="copy">reported</text>

  <rect x="48" y="578" width="1104" height="54" rx="12" fill="#fff4d9" stroke="#e8d39c"/>
  <text x="70" y="602" class="label">IC handoff:</text><text x="165" y="602" class="copy">Ask the dependency owner to compare this wait with other callers and the same time window.</text>
  <text x="70" y="621" class="copy">Synthetic records only. A matching log event is a lead to verify, not a root-cause verdict.</text>
</svg>
