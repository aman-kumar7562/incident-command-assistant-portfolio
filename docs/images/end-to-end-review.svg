<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end incident review process</title>
  <desc id="desc">Seven stages: scope the incident, read authorized evidence, map claims and chronology, assess customer impact, apply supplied policy, review actions and recovery, then prepare a draft for human review.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#172a42"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#73d6c2"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.title{font-size:30px;font-weight:700}.muted{fill:#b7c7d9}.step{fill:#203750;stroke:#42617c;stroke-width:2}.last{fill:#24453f;stroke:#73d6c2;stroke-width:2}.num{font-size:14px;font-weight:700;fill:#73d6c2}.head{font-size:17px;font-weight:700}.body{font-size:13px;fill:#c8d4e1}.arrow{stroke:#73d6c2;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/><text x="58" y="68" class="title">End-to-end incident review</text><text x="58" y="98" class="body">A repeatable path from scoped evidence to a decision-ready human briefing</text>
  <g transform="translate(54 160)">
    <rect width="168" height="170" rx="16" class="step"/><text x="20" y="31" class="num">01 · SCOPE</text><text x="20" y="67" class="head">Set the boundary</text><text x="20" y="100" class="body"><tspan x="20">Incident, service,</tspan><tspan x="20" dy="21">region, time window</tspan></text>
    <rect x="184" width="168" height="170" rx="16" class="step"/><text x="204" y="31" class="num">02 · SOURCES</text><text x="204" y="67" class="head">Read evidence</text><text x="204" y="100" class="body"><tspan x="204">Authorized sources;</tspan><tspan x="204" dy="21">record gaps and times</tspan></text>
    <rect x="368" width="168" height="170" rx="16" class="step"/><text x="388" y="31" class="num">03 · TRACE</text><text x="388" y="67" class="head">Map the story</text><text x="388" y="100" class="body"><tspan x="388">Claims, chronology,</tspan><tspan x="388" dy="21">user and service flow</tspan></text>
    <rect x="552" width="168" height="170" rx="16" class="step"/><text x="572" y="31" class="num">04 · IMPACT</text><text x="572" y="67" class="head">Bound impact</text><text x="572" y="100" class="body"><tspan x="572">Who is affected?</tspan><tspan x="572" dy="21">What can’t they do?</tspan></text>
    <rect x="736" width="168" height="170" rx="16" class="step"/><text x="756" y="31" class="num">05 · POLICY</text><text x="756" y="67" class="head">Assess priority</text><text x="756" y="100" class="body"><tspan x="756">Use supplied current</tspan><tspan x="756" dy="21">urgency/impact rules</tspan></text>
    <rect x="920" width="168" height="170" rx="16" class="step"/><text x="940" y="31" class="num">06 · RECOVERY</text><text x="940" y="67" class="head">Track response</text><text x="940" y="100" class="body"><tspan x="940">Actions, validation,</tspan><tspan x="940" dy="21">open risks and owners</tspan></text>
    <rect x="1104" width="168" height="170" rx="16" class="last"/><text x="1124" y="31" class="num">07 · BRIEF</text><text x="1124" y="67" class="head">Draft for review</text><text x="1124" y="100" class="body"><tspan x="1124">Concise findings;</tspan><tspan x="1124" dy="21">human decides and sends</tspan></text>
    <path d="M168 84h12M352 84h12M536 84h12M720 84h12M904 84h12M1088 84h12" class="arrow"/>
  </g>
  <rect x="54" y="380" width="1272" height="76" rx="16" fill="#302e3c" stroke="#ff9b6a" stroke-width="2"/><text x="78" y="412" class="head">Human control stays at the end</text><text x="78" y="438" class="body">The assistant analyzes and drafts. It does not post, page, edit records, deploy, or declare recovery on behalf of responders.</text>
</svg>
