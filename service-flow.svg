<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">Fictional appointment service flow and incident boundary</title>
  <desc id="desc">A customer request passes through the web app, edge gateway, booking API, and database. The example incident is localized to booking confirmation between the API and database. Monitoring and responders observe the failure and validate recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#172a42"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#73d6c2"/></marker>
    <marker id="hotArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff9b6a"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f7fb}.muted{fill:#b7c7d9}.title{font-size:30px;font-weight:700}.subtitle{font-size:16px}.box{fill:#203750;stroke:#42617c;stroke-width:2}.boxhot{fill:#3b3040;stroke:#ff9b6a;stroke-width:3}.label{font-size:19px;font-weight:650}.small{font-size:14px}.arrow{stroke:#73d6c2;stroke-width:4;fill:none;marker-end:url(#arrow)}.hot{stroke:#ff9b6a;stroke-width:4;stroke-dasharray:9 7;fill:none;marker-end:url(#hotArrow)}
    </style>
  </defs>
  <rect width="1400" height="640" rx="28" fill="url(#bg)"/>
  <text x="64" y="70" class="title">Service flow: where the customer journey breaks</text>
  <text x="64" y="102" class="subtitle muted">Fictional booking example • request path and evidence boundary</text>
  <rect x="58" y="185" width="220" height="120" rx="18" class="box"/><text x="168" y="232" text-anchor="middle" class="label">Customer</text><text x="168" y="264" text-anchor="middle" class="small muted">Choose a time</text>
  <rect x="350" y="185" width="220" height="120" rx="18" class="box"/><text x="460" y="232" text-anchor="middle" class="label">Web app</text><text x="460" y="264" text-anchor="middle" class="small muted">Submit booking</text>
  <rect x="642" y="185" width="220" height="120" rx="18" class="box"/><text x="752" y="232" text-anchor="middle" class="label">Edge gateway</text><text x="752" y="264" text-anchor="middle" class="small muted">Route request</text>
  <rect x="934" y="185" width="220" height="120" rx="18" class="boxhot"/><text x="1044" y="228" text-anchor="middle" class="label">Booking API</text><text x="1044" y="257" text-anchor="middle" class="small">Confirmation path</text><text x="1044" y="281" text-anchor="middle" class="small" fill="#ffba97">Example fault boundary</text>
  <rect x="1180" y="185" width="170" height="120" rx="18" class="box"/><text x="1265" y="232" text-anchor="middle" class="label">Database</text><text x="1265" y="264" text-anchor="middle" class="small muted">Persist booking</text>
  <path d="M278 245h62" class="arrow"/><path d="M570 245h62" class="arrow"/><path d="M862 245h55" class="hot"/><path d="M1154 245h18" class="hot"/>
  <rect x="215" y="390" width="410" height="150" rx="18" fill="#1d3447" stroke="#73d6c2" stroke-width="2"/><text x="245" y="431" class="label">Detection and impact evidence</text><text x="245" y="466" class="small muted">• Regional error alert</text><text x="245" y="492" class="small muted">• Customer reports: confirmation fails</text><text x="245" y="518" class="small muted">• Denominator and total reach: unknown</text>
  <rect x="775" y="390" width="410" height="150" rx="18" fill="#1d3447" stroke="#73d6c2" stroke-width="2"/><text x="805" y="431" class="label">Mitigation and recovery checks</text><text x="805" y="466" class="small muted">• Revert connection-pool setting</text><text x="805" y="492" class="small muted">• Retest customer booking path</text><text x="805" y="518" class="small muted">• Observe sustained health before closure</text>
  <path d="M1044 305v46q0 20-20 20H625" class="arrow"/><path d="M460 305v46q0 20 20 20h295" class="arrow"/>
  <text x="700" y="595" text-anchor="middle" class="small muted">Illustrative only: components and failure location come from the supplied evidence, never from this diagram template.</text>
</svg>
